services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app_dev_pw}
      POSTGRES_DB: aiconsole
      AI_READER_PASSWORD: ${AI_READER_PASSWORD:-reader_dev_pw}
      TZ: Asia/Bangkok
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro   # roles + ai_* tables + mock data (first start only)
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d aiconsole"]
      interval: 3s
      retries: 30

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://app:${DB_PASSWORD:-app_dev_pw}@db:5432/aiconsole
      READER_DATABASE_URL: postgres://ai_reader:${AI_READER_PASSWORD:-reader_dev_pw}@db:5432/aiconsole
      DOMAIN: ${DOMAIN:-shop}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
